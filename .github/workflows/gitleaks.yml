name: gitleaks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 直接下载 gitleaks 二进制跑 detect（显式 --config，避免 action 层配置加载不确定）。
      # PR/push 两种事件统一扫全部历史 + 工作树；allowlist 见 .gitleaks.toml。
      - name: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.18.4"
          mkdir -p /tmp/gitleaks
          curl -sL -o /tmp/gitleaks/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks
          /tmp/gitleaks/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-banner \
            --redact || {
              echo "::error::gitleaks 检测到疑似密钥泄露，请检查（allowlist 见 .gitleaks.toml）"
              exit 1
            }

      # 把 check-run 结果显式同步成 legacy commit status。
      # 分支保护 required_status_checks 匹配 legacy status context（/statuses/{sha}），
      # 而非 check-run；不写这步则合并永远 BLOCKED（检查全绿也 BLOCKED）。
      # context 名必须与分支保护完全一致("gitleaks"，注意非 job 名 "gitleaks secret scan")。
      - name: Sync check result to commit status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"; DESC="gitleaks passed"
          else
            STATE="failure"; DESC="gitleaks failed"
          fi
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"gitleaks\",\"description\":\"$DESC\"}"
