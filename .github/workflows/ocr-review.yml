name: ocr-review

# OpenCodeReview 代码审查门禁
# - PR：审查 base..head 的 diff
# - 推送到默认分支：审查 HEAD~1..HEAD
# 需要仓库 Secret：OPCODE_API_KEY（opencode Zen 网关，在 Settings > Secrets 添加）
# LLM provider：自定义 opencode-zen，指向 opencode.ai Zen API
#   url = https://opencode.ai/zen/go/v1（OpenAI Chat Completions 兼容）
#   protocol = openai
# 模型：deepseek-v4-flash（轻量快，实测可扛 ~174k token 大 diff 不超时）
#   —— 优于火山方舟 ark-code-latest（大 diff 稳定 context deadline exceeded）
# 默认门禁：发现评论即 fail CI（见 scripts/ocr-review.sh 的 --gate）

on:
  pull_request:
  push:
    branches: [main, master]

# statuses: write 用于把 check-run 结果显式同步成 legacy commit status
# （否则分支保护 required_status_checks 匹配不到 context，合并永远 BLOCKED）
permissions:
  contents: read
  statuses: write

jobs:
  # job 名即 check context 名，必须与分支保护 required_status_checks 的
  # context "ocr-review" 完全一致，否则门禁永不生效（BLOCKED 但检查全绿）
  ocr-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure LLM (opencode Zen)
        env:
          OPCODE_API_KEY: ${{ secrets.OPCODE_API_KEY }}
        run: |
          if [ -z "$OPCODE_API_KEY" ]; then
            echo "::error::缺少 Secret OPCODE_API_KEY，请在仓库 Settings > Secrets 配置"
            exit 1
          fi
          # 自定义 provider：opencode Zen API（OpenAI Chat Completions 兼容）
          ocr config set provider opencode-zen
          ocr config set custom_providers.opencode-zen.url https://opencode.ai/zen/go/v1
          ocr config set custom_providers.opencode-zen.protocol openai
          # 模型 ID：deepseek-v4-flash（轻量快，实测可扛 ~174k token 大 diff 不超时）
          ocr config set custom_providers.opencode-zen.model "deepseek-v4-flash"
          ocr config set custom_providers.opencode-zen.api_key "$OPCODE_API_KEY"

      - name: Run review (gate)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          echo "审查范围: $BASE..$HEAD"
          # 纯搬移重构例外（2026-08-12 起）：src/{auth,config,state}.rs、src/handlers/**、
          # src/{bootstrap,routes}.rs 是 main.rs 拆分搬移的存量代码（与重构前逐行一致），
          # ocr 对整段搬移 diff 的存量意见不阻塞零行为变更重构；存量意见归档
          # docs/reviews/ 跟踪。main.rs / Phase B 新代码（agent/llm/sanitize/lib）仍审查。
          OUT=$(ocr review --from "$BASE" --to "$HEAD" \
            --exclude '.github/**,.githooks/**,scripts/ocr-review.sh,**/__pycache__/**,**/*.bak,**/*.exe,**/*.csv,**/target/**,src/auth.rs,src/config.rs,src/state.rs,src/handlers/**,src/bootstrap.rs,src/routes.rs' 2>&1)
          echo "$OUT"
          FINDINGS=$(echo "$OUT" | grep -oE '[0-9]+ finding\(s\)' | grep -oE '[0-9]+' | head -1)
          FINDINGS="${FINDINGS:-0}"
          echo "评论数 = $FINDINGS"
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::OpenCodeReview 发现 $FINDINGS 条评论，门禁拦截合并"
            exit 1
          fi
          echo "[ocr] 未发现评论"

      # 把 check-run 结果显式同步成 legacy commit status。
      # 分支保护 required_status_checks 匹配的是 legacy status context（/statuses/{sha}），
      # 而 Actions check-run 从不自动生成它 → 不写这步则合并永远 BLOCKED（检查全绿也 BLOCKED）。
      # context 名必须与分支保护完全一致("ocr-review")。
      - name: Sync check result to commit status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"; DESC="ocr-review passed"
          else
            STATE="failure"; DESC="ocr-review failed"
          fi
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"ocr-review\",\"description\":\"$DESC\"}"
