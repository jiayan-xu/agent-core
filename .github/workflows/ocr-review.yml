name: ocr-review

# OpenCodeReview 代码审查门禁
# - PR：审查 base..head 的 diff
# - 推送到默认分支：审查 HEAD~1..HEAD
# 需要仓库 Secret：ARK_API_KEY（火山方舟，在 Settings > Secrets 添加）
# LLM provider：volcengine（内置 OpenAI 兼容端点 https://ark.cn-beijing.volces.com/api/v3）
# 默认门禁：发现评论即 fail CI（见 scripts/ocr-review.sh 的 --gate）

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  # job 名即 check context 名，必须与分支保护 required_status_checks 的
  # context "ocr-review" 完全一致，否则门禁永不生效（BLOCKED 但检查全绿）
  ocr-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure LLM (Volcengine Ark)
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          if [ -z "$ARK_API_KEY" ]; then
            echo "::error::缺少 Secret ARK_API_KEY，请在仓库 Settings > Secrets 配置"
            exit 1
          fi
          ocr config set provider volcengine
          # 模型 ID：火山方舟 ark-code-latest
          ocr config set model "ark-code-latest"
          ocr config set providers.volcengine.api_key "$ARK_API_KEY"

      - name: Run review (gate)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          echo "审查范围: $BASE..$HEAD"
          OUT=$(ocr review --from "$BASE" --to "$HEAD" \
            --exclude '.github/**,.githooks/**,scripts/ocr-review.sh,**/__pycache__/**,**/*.bak,**/*.exe,**/*.csv,**/target/**' 2>&1)
          echo "$OUT"
          FINDINGS=$(echo "$OUT" | grep -oE '[0-9]+ finding\(s\)' | grep -oE '[0-9]+' | head -1)
          FINDINGS="${FINDINGS:-0}"
          echo "评论数 = $FINDINGS"
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::OpenCodeReview 发现 $FINDINGS 条评论，门禁拦截合并"
            exit 1
          fi
          echo "[ocr] 未发现评论"
