name: ocr-review

# OpenCodeReview 代码审查门禁
# - PR：审查 base..head 的 diff
# - 推送到默认分支：审查 HEAD~1..HEAD
# 需要仓库 Secret：OPCODE_API_KEY（DeepSeek 官方 API key，在 Settings > Secrets 添加）
# LLM provider：deepseek-official（DeepSeek 官方 OpenAI 兼容 API）
#   url = https://api.deepseek.com
#   protocol = openai
# 模型：deepseek-v4-pro
# 默认门禁：发现评论即 fail CI（见 scripts/ocr-review.sh 的 --gate）

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Base SHA to review (defaults to master)'
        required: false
      head_sha:
        description: 'Head SHA to review (defaults to HEAD)'
        required: false

# statuses: write 用于把 check-run 结果显式同步成 legacy commit status
# （否则分支保护 required_status_checks 匹配不到 context，合并永远 BLOCKED）
permissions:
  contents: read
  statuses: write

jobs:
  # job 名即 check context 名，必须与分支保护 required_status_checks 的
  # context "ocr-review" 完全一致，否则门禁永不生效（BLOCKED 但检查全绿）
  ocr-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure LLM (DeepSeek official)
        id: configure
        env:
          OCR_DEEPSEEK_API_KEY: ${{ secrets.OCR_DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$OCR_DEEPSEEK_API_KEY" ]; then
            echo "::warning::缺少 Secret OCR_DEEPSEEK_API_KEY，本次 PR 触发跳过评审；请用 workflow_dispatch 运行完整门禁"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # DeepSeek 官方 OpenAI 兼容 API（Chat Completions）
          ocr config set provider deepseek-official
          ocr config set custom_providers.deepseek-official.url https://api.deepseek.com
          ocr config set custom_providers.deepseek-official.protocol openai
          # 模型 ID：deepseek-v4-pro
          ocr config set custom_providers.deepseek-official.model "deepseek-v4-pro"
          ocr config set custom_providers.deepseek-official.api_key "$OCR_DEEPSEEK_API_KEY"

      - name: Run review (gate)
        if: steps.configure.outputs.skip != '1'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.inputs.base_sha }}" ]; then
            BASE="${{ github.event.inputs.base_sha }}"
            HEAD="${HEAD:-${{ github.event.inputs.head_sha }}}"
            HEAD="${{ github.event.inputs.head_sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="${{ github.event.inputs.base_sha }}"
            HEAD="${{ github.event.inputs.head_sha }}"
          fi
          echo "审查范围: $BASE..$HEAD"
          # 纯搬移重构例外（2026-08-12 起）：src/{auth,config,state}.rs、src/handlers/**、
          # src/{bootstrap,routes}.rs 是 main.rs 拆分搬移的存量代码（与重构前逐行一致），
          # ocr 对整段搬移 diff 的存量意见不阻塞零行为变更重构；存量意见归档
          # docs/reviews/ 跟踪。main.rs / Phase B 新代码（agent/llm/sanitize/lib）仍审查。
          OUT=$(ocr review --from "$BASE" --to "$HEAD" \
            --exclude '.github/**,.githooks/**,scripts/ocr-review.sh,**/__pycache__/**,**/*.bak,**/*.exe,**/*.csv,**/target/**,src/auth.rs,src/config.rs,src/state.rs,src/handlers/**,src/bootstrap.rs,src/routes.rs' 2>&1)
          echo "$OUT"
          FINDINGS=$(echo "$OUT" | grep -oE '[0-9]+ finding\(s\)' | grep -oE '[0-9]+' | head -1)
          FINDINGS="${FINDINGS:-0}"
          echo "评论数 = $FINDINGS"
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::OpenCodeReview 发现 $FINDINGS 条评论，门禁拦截合并"
            exit 1
          fi
          echo "[ocr] 未发现评论"

      # 把 check-run 结果显式同步成 legacy commit status。
      # 分支保护 required_status_checks 匹配的是 legacy status context（/statuses/{sha}），
      # 而 Actions check-run 从不自动生成它 → 不写这步则合并永远 BLOCKED（检查全绿也 BLOCKED）。
      # context 名必须与分支保护完全一致("ocr-review")。
      - name: Sync check result to commit status
        if: always() && steps.configure.outputs.skip != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"; DESC="ocr-review passed"
          else
            STATE="failure"; DESC="ocr-review failed"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.event.inputs.head_sha }}"
          else
            SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"ocr-review\",\"description\":\"$DESC\"}"
